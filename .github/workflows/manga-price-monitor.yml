name: Manga Price Intelligence

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".github/copilot-instructions.md"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: manga-price-intelligence-main
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate configuration
        run: python scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Discover product-page candidates
        run: python scripts/discover.py

      - name: Observe registered product pages
        run: python scripts/monitor.py

      - name: Regenerate report
        run: python scripts/report.py

      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Update manga price evidence"
            git pull --rebase origin main
            git push
          fi
